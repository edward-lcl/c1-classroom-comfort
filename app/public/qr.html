<!doctype html>
<html lang="en" data-title-key="qr.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C1 feedback QR code</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body class="qr-page">
  <main>
    <div class="form-top"><span></span><div class="lang-seg" role="group" aria-label="Language / 语言"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中</button></div></div>
    <h1 data-i18n="qr.h1">Scan to give classroom feedback</h1>
    <p class="notice" data-i18n="qr.notice"></p>
    <div id="codes"></div>
    <section class="howto">
      <h2 data-i18n="qr.howH"></h2>
      <ol>
        <li data-i18n="qr.how1"></li>
        <li data-i18n="qr.how2"></li>
        <li data-i18n="qr.how3"></li>
        <li data-i18n="qr.how4"></li>
      </ol>
    </section>

  <script src="/static/qr.js"></script>

</html>
