<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Schematics for photoresistor divider and LM35">
<title>Schematics for photoresistor divider and LM35</title>
<rect width="900" height="240" fill="#ffffff"/>
<text x="20" y="26" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#1b2330" font-weight="700">Circuits (electrical view)</text><text x="20" y="56" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#1b2330" font-weight="600">A. Photoresistor voltage divider → A1</text><circle cx="40" cy="100" r="4" fill="none" stroke="#1b2330"/><text x="40" y="88" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#1b2330" text-anchor="middle" font-weight="600">5V</text><line x1="44" y1="100" x2="80" y2="100" stroke="#1b2330" stroke-width="2"/><circle cx="102" cy="100" r="20" fill="#fff" stroke="#1b2330" stroke-width="2"/><path d="M88 100 l4 -6 l4 12 l4 -12 l4 12 l4 -12 l4 6" fill="none" stroke="#1b2330" stroke-width="1.6"/><path d="M86 68 l8 9 M94 66 l8 9" stroke="#c48600" stroke-width="2"/><text x="102" y="136" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1b2330" text-anchor="middle">LDR</text><line x1="122" y1="100" x2="190" y2="100" stroke="#1b2330" stroke-width="2"/><circle cx="160" cy="100" r="4" fill="#1b2330"/><line x1="160" y1="100" x2="160" y2="140" stroke="#1e8a4c" stroke-width="2"/><text x="160" y="156" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#1e8a4c" text-anchor="middle" font-weight="700">A1</text><path d="M190 100 l5 -7 l6 14 l6 -14 l6 14 l6 -14 l6 14 l5 -7" fill="none" stroke="#1b2330" stroke-width="2"/><text x="215" y="86" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1b2330" text-anchor="middle">10 kΩ</text><line x1="240" y1="100" x2="270" y2="100" stroke="#1b2330" stroke-width="2"/><circle cx="274" cy="100" r="4" fill="none" stroke="#1b2330"/><text x="274" y="88" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#1b2330" text-anchor="middle" font-weight="600">GND</text><text x="20" y="186" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">More light → lower LDR resistance →</text><text x="20" y="201" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">higher voltage at A1 → higher number (0–1023).</text><text x="340" y="56" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#1b2330" font-weight="600">B. LM35DZ temperature sensor → A0</text><rect x="350" y="74" width="110" height="58" rx="6" fill="#1b1d22"/><text x="405" y="98" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">LM35DZ</text><text x="405" y="114" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9" fill="#bbb" text-anchor="middle">flat face</text><line x1="368" y1="132" x2="368" y2="165" stroke="#888" stroke-width="2.5"/><text x="368" y="180" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9.5" fill="#1b2330" text-anchor="middle">1 +Vs</text><text x="368" y="196" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#d23f45" text-anchor="middle" font-weight="700">→ 5V</text><line x1="405" y1="132" x2="405" y2="165" stroke="#888" stroke-width="2.5"/><text x="405" y="180" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9.5" fill="#1b2330" text-anchor="middle">2 Vout</text><text x="405" y="196" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#c48600" text-anchor="middle" font-weight="700">→ A0</text><line x1="442" y1="132" x2="442" y2="165" stroke="#888" stroke-width="2.5"/><text x="442" y="180" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9.5" fill="#1b2330" text-anchor="middle">3 GND</text><text x="442" y="196" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#2a2a2e" text-anchor="middle" font-weight="700">→ GND</text><text x="480" y="92" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">Hold it with the printed flat face</text><text x="480" y="107" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">toward you, legs down: left = +Vs,</text><text x="480" y="122" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">middle = Vout, right = GND.</text><text x="480" y="140" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">Check TI datasheet figure (LP package).</text><text x="480" y="155" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#d23f45" font-weight="600">Reversed = gets hot within seconds.</text><text x="340" y="226" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">T(°C) = raw × 5.0 / 1024 × 100  (≈ 0.49 °C per step)</text>
</svg>
