<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336" role="img" aria-label="ENS160 plus AHT21 module to Arduino UNO I2C wiring">
<title>ENS160 plus AHT21 module to Arduino UNO I2C wiring</title>
<rect width="820" height="336" fill="#ffffff"/>
<text x="20" y="26" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#1b2330" font-weight="700">ENS160 + AHT21 module (Mingwu) → UNO I²C — only after the checks in HARDWARE_GUIDE §3</text><rect x="40" y="60" width="210" height="190" rx="10" fill="#2f78b7"/><rect x="150" y="95" width="34" height="30" rx="3" fill="#d9dde3"/><text x="167" y="140" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9" fill="#fff" text-anchor="middle">ENS160</text><rect x="190" y="160" width="30" height="24" rx="3" fill="#d9dde3"/><text x="205" y="198" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="9" fill="#fff" text-anchor="middle">AHT21</text><circle cx="60" cy="74" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="78" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">VIN</text><line x1="250" y1="74" x2="420" y2="74" stroke="#d23f45" stroke-width="3.5" stroke-dasharray="7 4"/><rect x="420" y="64" width="86" height="20" rx="4" fill="#1b1d22"/><text x="463" y="78" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#f2c230" text-anchor="middle" font-weight="700">5V</text><text x="516" y="78" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#d23f45" font-weight="600">only if §3 checks pass</text><circle cx="60" cy="96" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="100" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">3V3</text><text x="260" y="100" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878">leave unconnected (regulator output)</text><circle cx="60" cy="118" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="122" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">GND</text><line x1="250" y1="118" x2="420" y2="118" stroke="#2a2a2e" stroke-width="3.5" stroke-dasharray=""/><rect x="420" y="108" width="86" height="20" rx="4" fill="#1b1d22"/><text x="463" y="122" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#f2c230" text-anchor="middle" font-weight="700">GND</text><circle cx="60" cy="140" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="144" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">SCL</text><line x1="250" y1="140" x2="420" y2="140" stroke="#8a4bc4" stroke-width="3.5" stroke-dasharray=""/><rect x="420" y="130" width="86" height="20" rx="4" fill="#1b1d22"/><text x="463" y="144" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#f2c230" text-anchor="middle" font-weight="700">A5 / SCL</text><circle cx="60" cy="162" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="166" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">SDA</text><line x1="250" y1="162" x2="420" y2="162" stroke="#3e63dd" stroke-width="3.5" stroke-dasharray=""/><rect x="420" y="152" width="86" height="20" rx="4" fill="#1b1d22"/><text x="463" y="166" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#f2c230" text-anchor="middle" font-weight="700">A4 / SDA</text><circle cx="60" cy="184" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="188" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">ADD</text><text x="260" y="188" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878">leave unconnected; measure (see below)</text><circle cx="60" cy="206" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="210" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">CS</text><text x="260" y="210" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878">leave unconnected; measure (see below)</text><circle cx="60" cy="228" r="6" fill="#d9c27a" stroke="#8a7a3a"/><text x="74" y="232" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#fff" font-weight="600">INT</text><text x="260" y="232" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878">leave unconnected (not used)</text><path d="M250 0" /><text x="40" y="282" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">Header row as printed on the module: VIN · 3V3 · GND · SCL · SDA · ADD · CS · INT (check your board — labels win over this picture).</text><text x="40" y="300" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">ADD: high ≈ address 0x53, low ≈ 0x52 (the sketch tries both).  CS must read high (I²C mode).  AHT21 answers at 0x38.</text><text x="40" y="318" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">If SDA/SCL measure ≈ 0 V with the module powered: no pull-ups — add 4.7 kΩ from SDA and SCL to 3.3 V (never to 5 V).</text>
</svg>
