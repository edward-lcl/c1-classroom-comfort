<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 380" width="930" height="380" role="img" aria-label="C1 system overview">
<title>C1 system overview</title>
<rect width="930" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2330"/></marker></defs><text x="20" y="26" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#1b2330" font-weight="700">C1 system overview — Sensing → Networking → Data analysis → Application</text><text x="110" y="58" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#5d6878" text-anchor="middle" font-weight="700">SENSING LAYER</text><text x="380" y="58" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#5d6878" text-anchor="middle" font-weight="700">NETWORKING</text><text x="560" y="58" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#5d6878" text-anchor="middle" font-weight="700">DATA ANALYSIS</text><text x="790" y="58" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#5d6878" text-anchor="middle" font-weight="700">APPLICATION</text><rect x="20" y="70" width="180" height="120" rx="10" fill="#f6f7f9" stroke="#1b2330" stroke-width="1.5"/><text x="110" y="94" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#1b2330" text-anchor="middle" font-weight="700">Sensors</text><text x="110" y="114" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">Photoresistor (A1)</text><text x="110" y="129" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">LM35DZ (A0)</text><text x="110" y="144" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">ENS160 + AHT21 (I²C)</text><text x="110" y="159" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">measured · estimate</text><rect x="20" y="210" width="180" height="70" rx="10" fill="#f6f7f9" stroke="#1b2330" stroke-width="1.5"/><text x="110" y="234" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#1b2330" text-anchor="middle" font-weight="700">Arduino UNO R3</text><text x="110" y="254" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">reads every 2 s</text><text x="110" y="269" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">prints 1 JSON line</text><line x1="110" y1="190" x2="110" y2="208" stroke="#1b2330" stroke-width="2" marker-end="url(#ar)"/><rect x="450" y="70" width="220" height="210" rx="10" fill="#f6f7f9" stroke="#3e63dd" stroke-width="1.5"/><text x="560" y="94" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#3e63dd" text-anchor="middle" font-weight="700">Laptop app (Node.js)</text><text x="560" y="114" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">serial bridge (USB)</text><text x="560" y="129" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">validates each line</text><text x="560" y="144" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">freshness: stale after 10 s</text><text x="560" y="159" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">rules + hysteresis (no AI)</text><text x="560" y="174" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">simulated CO₂ (labelled)</text><text x="560" y="189" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">saves JSON Lines files</text><text x="560" y="204" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">web server</text><line x1="200" y1="245" x2="448" y2="245" stroke="#1b2330" stroke-width="2" marker-end="url(#ar)"/><text x="324" y="238" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878" text-anchor="middle">USB serial cable</text><rect x="720" y="70" width="180" height="100" rx="10" fill="#f6f7f9" stroke="#1b2330" stroke-width="1.5"/><text x="810" y="94" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#1b2330" text-anchor="middle" font-weight="700">Staff dashboard</text><text x="810" y="114" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">readings + feedback</text><text x="810" y="129" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">“Needs review” prompt</text><text x="810" y="144" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">review log</text><rect x="720" y="190" width="180" height="90" rx="10" fill="#f6f7f9" stroke="#1b2330" stroke-width="1.5"/><text x="810" y="214" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#1b2330" text-anchor="middle" font-weight="700">Student phone</text><text x="810" y="234" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">scans QR → form</text><text x="810" y="249" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">(same Wi-Fi / hotspot)</text><line x1="670" y1="120" x2="718" y2="120" stroke="#1b2330" stroke-width="2" marker-end="url(#ar)"/><text x="694" y="112" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878" text-anchor="middle">web page</text><line x1="718" y1="235" x2="672" y2="235" stroke="#1b2330" stroke-width="2" marker-end="url(#ar)"/><text x="695" y="228" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878" text-anchor="middle">feedback</text><rect x="720" y="300" width="180" height="64" rx="10" fill="#f6f7f9" stroke="#c48600" stroke-width="1.5"/><text x="810" y="324" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#c48600" text-anchor="middle" font-weight="700">Person reviews room</text><text x="810" y="344" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">opens window / checks AC</text><text x="810" y="359" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878" text-anchor="middle">logs what was done</text><polyline points="900,130 912,130 912,332 902,332" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#ar)"/><text x="906" y="300" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#5d6878" text-anchor="end">prompt</text><text x="20" y="330" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5d6878">No cloud, no AI: one classroom, small data, rules a person can explain. Does not control the AC.</text>
</svg>
